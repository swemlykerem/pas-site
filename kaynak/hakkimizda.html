<section class="bolum hakkimizda" aria-labelledby="hk-baslik">
  <div class="kap hk-izgara">
    <div>
      <h1 class="belir" id="hk-baslik">{{hk_ust}}</h1>
      <p class="giris belir" style="--i:1">{{hk_giris}}</p>
      <dl class="hk-bilgi belir" style="--i:2">
        <div><dt>{{hk_bas_b}}</dt><dd>{{hk_bas_p}}</dd></div>
        <div><dt>{{hk_yer_b}}</dt><dd>{{hk_yer_p}}</dd></div>
        <div><dt>{{hk_asama_b}}</dt><dd>{{hk_asama_p}}</dd></div>
        <div><dt>{{hk_gel_b}}</dt><dd>{{hk_gel_p}}</dd></div>
      </dl>
    </div>
    <figure class="kurucu belir" style="--i:2">
      <span class="monogram" aria-hidden="true">ŞK</span>
      <figcaption>
        <b>{{kurucu_ad}}</b>
        <span class="rol">{{hk_rol}}</span>
        <p>{{hk_bio}}</p>
        <a class="bag" href="mailto:{{eposta}}">{{eposta}}</a>
      </figcaption>
    </figure>
  </div>
</section>
